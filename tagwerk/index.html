<title>Tagwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: "observatory" phone — dotted black field, big left title, square glass tiles that glow from the rim, badge on top, caption at the bottom. Single committed dark look on a soft grey stage. */
:root {
  --stage: #d3d3d8;
  --ink: #050507;
  --glass: #1d1d24;
  --line: rgba(255,255,255,.12);
  --fg: #f4f2f7;
  --muted: rgba(244,242,247,.58);
  --signal: #e6ee6c;
  --f-num: "Doto", ui-monospace, "SF Mono", Menlo, monospace;
  --f-body: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--stage); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.wrap { display: flex; justify-content: center; padding-inline: 16px; padding-block: 32px 48px; }
.phone {
  width: 100%; max-width: 440px; border-radius: 52px; padding: 18px 20px 18px; min-width: 0;
  background-color: var(--ink);
  background-image: radial-gradient(rgba(255,255,255,.085) 1px, transparent 1.3px);
  background-size: 13px 13px;
  box-shadow: 0 0 0 9px #9d9da4, 0 0 0 10px #85858c, 0 50px 90px -30px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: 14px;
}
.island { width: 104px; height: 30px; border-radius: 20px; background: #000; margin: 0 auto; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; }
.island .dot { width: 7px; height: 7px; border-radius: 50%; background: #2a2a2e; }
.island .dot.on { background: #4fe3c8; box-shadow: 0 0 10px #4fe3c8; }

/* top bar */
.top { display: flex; align-items: center; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 7; margin: -8px -10px 4px; padding: 8px 10px; border-radius: 999px; transition: background .3s, box-shadow .3s; }
.top.scrolled { background: rgba(20,20,26,.55); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 10px 30px -12px rgba(0,0,0,.8); }
.round { width: 44px; height: 44px; flex: none; border-radius: 50%; background: rgba(255,255,255,.07); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; padding: 0; }
.seg { flex: 1; display: flex; justify-content: center; min-width: 0; }
.seg div { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: rgba(10,10,14,.8); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 8px 13px; font-size: 13px; cursor: pointer; color: var(--fg); }
.seg button[aria-selected="true"] { background: #3a3a42; }
.ringbtn { position: relative; }
.ringbtn svg { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); }
.ringbtn b { font: 800 13px var(--f-num); }

.head { padding: 6px 6px 0; display: flex; flex-direction: column; gap: 2px; }
.head h1 { font: 400 34px/1.1 var(--f-body); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.head .sub { color: var(--muted); font-size: 13px; }

.days { display: flex; justify-content: space-between; gap: 4px; }
.day { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: rgba(5,5,7,.8); font: 500 12px var(--f-body); cursor: pointer; position: relative; padding: 0; }
.day[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.day .pip { position: absolute; left: 50%; bottom: -7px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--signal); }
.day:disabled { opacity: .3; cursor: default; }
.wave { display: block; width: 100%; height: 50px; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 30px 6px 2px; display: flex; align-items: center; gap: 12px; }
.label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
#view { display: flex; flex-direction: column; gap: 16px; }

/* tiles */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile {
  --c: #4b4b5a; --light: #7c7c90; --deep: #0a0a0e;
  position: relative; isolation: isolate; overflow: hidden; min-width: 0;
  border-radius: 32px; padding: 12px 12px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  background: radial-gradient(85% 80% at 50% 42%, #09090c 30%, #20202a 82%, #3b3b48 118%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 1.5px 0 rgba(255,255,255,.2), inset 0 -22px 34px -14px color-mix(in srgb, var(--c) 70%, transparent), 0 22px 34px -22px rgba(0,0,0,.95), 0 2px 6px rgba(0,0,0,.35);
}
.tile.sq { aspect-ratio: 1 / 1.05; }
.tile.wide { grid-column: 1 / -1; }
.tile.glow { background: radial-gradient(78% 74% at 50% 46%, var(--deep) 8%, var(--c) 70%, var(--light) 118%); }
.tile.flood { background: radial-gradient(70% 70% at 50% 46%, var(--c) 25%, var(--light) 125%); }
.tile.left { align-items: stretch; text-align: left; padding: 16px 20px 18px; gap: 10px; }

.c-violet { --c: #6447e0; --light: #93b4ff; --deep: #1c1060; }
.c-teal   { --c: #1d9188; --light: #84e6d4; --deep: #06221f; }
.c-rose   { --c: #d4448d; --light: #f2b5dc; --deep: #33091f; }
.c-sage   { --c: #6f9a82; --light: #cfe4d6; --deep: #0f1914; }
.c-cobalt { --c: #2f45cc; --light: #7fa4ff; --deep: #080d36; }
.c-ember  { --c: #d4673a; --light: #ffb48c; --deep: #331106; }
.c-plum   { --c: #5a2fb8; --light: #8a7cff; --deep: #150a3a; }

.hit { position: absolute; inset: 0; z-index: 1; border: 0; background: transparent; cursor: pointer; border-radius: inherit; padding: 0; }
.corner {
  position: absolute; top: 11px; left: 11px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; padding: 0;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 16px; line-height: 1;
}
.corner svg, .step svg, .send svg, .round svg { display: block; }
.step, .send { display: inline-grid; place-items: center; }
.corner.r { left: auto; right: 11px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  font-size: 11px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.38); border: 1px solid rgba(255,255,255,.1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px;
}
.badge.ghost { visibility: hidden; }
.tile:has(.corner) .badge { max-width: calc(100% - 84px); }
.tile > * { flex-shrink: 0; }
.tile.sq { overflow: visible; }
.fv .txt { flex-shrink: 1; }
.badge .live { width: 6px; height: 6px; border-radius: 50%; background: #4fe3c8; flex: none; }
.vis { flex: 1 0 auto; width: 100%; display: grid; place-items: center; min-height: 0; position: relative; }
.cap { display: flex; flex-direction: column; gap: 1px; min-width: 0; max-width: 100%; }
.cap b { font-weight: 500; font-size: 13.5px; overflow-wrap: anywhere; }
.cap span { font-size: 11.5px; color: rgba(255,255,255,.62); }
.num { font: 800 42px/1 var(--f-num); font-variant-numeric: tabular-nums; }
.num small { font: 500 12px var(--f-body); color: rgba(255,255,255,.7); margin-left: 3px; }

/* ruler */
.ruler { position: relative; height: 22px; width: 82%; }
.ruler .ticks { position: absolute; inset: 7px 0 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 1px, transparent 1px 6px); }
.ruler .fill { position: absolute; left: 0; top: 7px; bottom: 0; background: repeating-linear-gradient(90deg, var(--fg) 0 1.5px, transparent 1.5px 6px); }
.ruler .mark { position: absolute; top: 0; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid var(--signal); transform: translateX(-5px); }
.ruler .mark::after { content: ""; position: absolute; left: -1px; top: 0; width: 2px; height: 16px; background: var(--signal); }

/* orb + sphere + aura */
.orb { position: relative; width: 100%; height: 78px; overflow: hidden; }
.orb::after { content: ""; position: absolute; left: -12px; right: -12px; bottom: 0; height: 1px; background: rgba(255,255,255,.3); }
.orb i { position: absolute; left: 50%; width: 76px; height: 76px; margin-left: -38px; border-radius: 50%;
  background: radial-gradient(circle at 50% 28%, #d9e4ff, #8ea2ff 42%, #6a5cff 75%); box-shadow: 0 0 36px rgba(140,160,255,.55); }
.sphere { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #e8f0ff, #8aa8ff 40%, #4a3fd0 80%); box-shadow: 0 0 34px rgba(120,150,255,.5); }
.aura { position: absolute; inset: 0; margin: auto; width: 96px; height: 96px; }
.over { position: relative; }
.dots7 { display: flex; gap: 5px; justify-content: center; }
.dots7 i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.22); }
.dots7 i.on { background: var(--fg); box-shadow: 0 0 6px rgba(255,255,255,.6); }

/* summary */
.sum { background: linear-gradient(165deg, #6f5f8e 0%, #b57d8c 55%, #e3958a 100%); flex-direction: row; justify-content: space-between; align-items: center; text-align: left; padding: 18px 20px; }
.sum .big { font: 400 36px/1 var(--f-body); letter-spacing: -.02em; }
.sum .big small { font-size: 15px; color: rgba(255,255,255,.8); margin-left: 4px; }
.sum h2 { font: 400 13px var(--f-body); margin: 0 0 14px; color: rgba(255,255,255,.88); }
.ring { position: relative; width: 92px; height: 92px; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; }
.ring b { font: 800 26px var(--f-num); }

/* inner controls */
.chip { border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.3); border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.quote { font: 400 21px/1.28 var(--f-body); letter-spacing: -.01em; margin: 6px 4px 0; text-wrap: balance; }
.noteform { display: flex; gap: 6px; }
input[type="text"] {
  flex: 1; min-width: 0; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.16); color: var(--fg);
  border-radius: 999px; padding: 11px 16px; font: inherit; font-size: 16px;
}
input::placeholder { color: rgba(255,255,255,.45); }
.send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--fg); color: var(--ink); cursor: pointer; font-size: 20px; flex: none; }
.notelist { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.notelist li { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: baseline; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.09); }
.notelist time { font: 600 12px var(--f-num); color: rgba(255,255,255,.6); }
.notelist span { overflow-wrap: anywhere; min-width: 0; font-size: 14px; }
.notelist .del { border: 0; background: none; color: rgba(255,255,255,.45); cursor: pointer; font-size: 17px; padding: 0 4px; }
.rowhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rowhead h2 { font: 500 13.5px var(--f-body); margin: 0; }
.empty { color: rgba(255,255,255,.6); font-size: 13px; margin: 4px 0; }

/* week */
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 130px; margin-top: 8px; }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; height: 100%; border: 0; background: none; padding: 0; cursor: pointer; }
.bar:disabled { cursor: default; }
.bar b { width: 100%; max-width: 26px; border-radius: 999px; background: linear-gradient(180deg, #e3958a, #6f5f8e); min-height: 6px; }
.bar.today b { background: var(--signal); }
.bar span { font: 600 11px var(--f-num); color: rgba(255,255,255,.65); }
.matrix { display: grid; gap: 8px 4px; align-items: center; overflow-x: auto; margin-top: 8px; }
.matrix .lbl { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: rgba(255,255,255,.85); }
.matrix .hd { font: 600 10px var(--f-num); text-align: center; color: rgba(255,255,255,.5); }
.matrix .c { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.1); justify-self: center; }
.matrix .c.on { background: var(--fg); box-shadow: 0 0 6px rgba(255,255,255,.5); }

.status { text-align: center; font-size: 10.5px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 2px 0 0; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; padding-inline: 16px; }
.sheet {
  width: 100%; max-width: 430px; max-height: 86vh; overflow: auto; border-radius: 34px 34px 0 0;
  padding: 18px 14px calc(26px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px;
  background-color: #0b0b0f; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.3px); background-size: 13px 13px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
}
.sheet .shead { display: flex; align-items: center; gap: 12px; }
.sheet .shead h3 { margin: 0; font: 400 24px/1.15 var(--f-body); flex: 1; min-width: 0; overflow-wrap: anywhere; letter-spacing: -.01em; }
.editrow { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-top: 1px solid rgba(255,255,255,.1); }
.editrow span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.step { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); cursor: pointer; font-size: 16px; line-height: 1; padding: 0; flex: none; }
.step:disabled { opacity: .3; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal div { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: rgba(255,255,255,.08); display: grid; place-items: center; font: 600 10px var(--f-num); color: rgba(255,255,255,.55); }
.cal div.on { background: var(--fg); color: var(--ink); box-shadow: 0 0 8px rgba(255,255,255,.4); }
.cal div.blank { background: transparent; }

.sheet h4 { margin: 4px 2px 0; font: 500 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sheet .bars { height: 96px; margin-top: 0; }
.bigrow { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 6px 0; }
.bigrow .num { font-size: 72px; }
.step.lg { width: 54px; height: 54px; font-size: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.cta { border: 0; border-radius: 999px; padding: 14px 18px; font-size: 15px; font-weight: 500; cursor: pointer; background: var(--fg); color: var(--ink); width: 100%; }
.cta.ghost { background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid var(--line); }
.cta.danger { background: transparent; color: #ff9a9a; border: 1px solid rgba(255,140,140,.3); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; background: var(--c); }
.swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--ink) inset; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 8px; padding: 10px 2px; border-top: 1px solid rgba(255,255,255,.09); min-width: 0; }
.item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.item .grow b { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
.item .grow span { font-size: 12px; color: var(--muted); }
.item.past { opacity: .5; }
.tag { font: 600 11px var(--f-body); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; white-space: nowrap; }
.tag { text-decoration: none; color: var(--fg); }
.tag.won { background: #2f7d5f; border-color: transparent; }
.tag.lost { background: rgba(255,120,120,.18); color: #ffb3b3; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stats div { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats b { font: 800 22px var(--f-num); }
.stats span { font-size: 11px; color: var(--muted); }
.formcol { display: flex; flex-direction: column; gap: 8px; }
input[type="date"], input[type="number"], input[type="time"] {
  flex: 1; min-width: 0; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.16); color: var(--fg);
  border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 16px;
}
.lanes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 86%; align-items: end; height: 62px; }
.lane { display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; }
.lane i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 5px rgba(255,255,255,.5); }
.lane i.off { background: rgba(255,255,255,.15); box-shadow: none; }
.lane em { font: 600 9px var(--f-num); font-style: normal; color: rgba(255,255,255,.6); }
.mono { font: 800 44px/1 var(--f-num); letter-spacing: .02em; flex: none; }
.fv { flex-direction: row; justify-content: space-between; align-items: center; text-align: left; padding: 18px 20px; gap: 14px; }
.fv .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fv .txt b { font: 400 22px/1.1 var(--f-body); letter-spacing: -.01em; }
.fv .txt span { font-size: 12px; color: rgba(255,255,255,.7); }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.heat div { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font: 600 10px var(--f-num); color: rgba(255,255,255,.7); max-width: 100%; }
.dayline { position: relative; height: 10px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
.dayline b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6f5f8e, #e3958a); border-radius: 999px; }
.dayline i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--signal); }

:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* v11: calmer Heute */
.ch-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); background: rgba(0,0,0,.25); font-size: 12px; cursor: pointer; }
.ch-link i { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 8px var(--signal); }
.label .lbl-act { order: 3; border: 0; background: none; padding: 4px 0 4px 6px; font: 500 12px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--fg); cursor: pointer; }
.label::after { order: 2; }
.hlist { display: flex; flex-direction: column; gap: 10px; }
.hpill { --c: #4b4b5a; --light: #7c7c90; --deep: #0a0a0e; position: relative; isolation: isolate; display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 10px 10px 10px 12px; border-radius: 26px; border: 0; width: 100%; text-align: left;
  background: linear-gradient(100deg, #0c0c10 0%, #16161c 60%, color-mix(in srgb, var(--c) 30%, #16161c) 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 1.5px 0 rgba(255,255,255,.16), 0 16px 26px -20px rgba(0,0,0,.95); }
.hpill.on { background: linear-gradient(100deg, var(--deep) 0%, var(--c) 58%, var(--light) 130%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 0 1.5px 0 rgba(255,255,255,.32), 0 16px 30px -18px color-mix(in srgb, var(--c) 80%, transparent); }
.hpill > *:not(.hit) { position: relative; z-index: 2; pointer-events: none; }
.hpill .hp-c { pointer-events: auto; }
.hp-g { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.32); flex: none; }
.hp-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hp-t b { font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }
.hp-t span { font-size: 12px; color: rgba(255,255,255,.62); }
.hpill.on .hp-t span { color: rgba(255,255,255,.82); }
.hp-c { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.4); background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; }
.hpill.on .hp-c { background: var(--fg); color: #121216; border-color: var(--fg); }
.stack { display: flex; flex-direction: column; }
.band { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; border: 0; text-align: left; cursor: pointer; padding: 16px 20px 34px; border-radius: 30px; margin-top: -20px;
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), inset 0 0 0 1px rgba(255,255,255,.1), 0 -12px 24px -14px rgba(0,0,0,.85); }
.band:first-child { margin-top: 0; }
.band:last-child { padding-bottom: 18px; }
.bd-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bd-l b { font: 500 16px var(--f-body); }
.bd-l span { font-size: 12px; color: rgba(255,255,255,.78); overflow-wrap: anywhere; }
.bd-v { font: 800 28px/1 var(--f-num); white-space: nowrap; text-shadow: 0 0 14px rgba(255,255,255,.35); }
.bd-v small { font: 500 11px var(--f-body); margin-left: 4px; color: rgba(255,255,255,.75); text-shadow: none; }
.b-rose { background: radial-gradient(80% 140% at 85% 0%, #f2b5dc 0%, rgba(242,181,220,0) 60%), linear-gradient(120deg, #4a1030, #d4448d); }
.b-sage { background: radial-gradient(80% 140% at 85% 0%, #cfe4d6 0%, rgba(207,228,214,0) 60%), linear-gradient(120deg, #13241b, #5f8c74); }
.b-ember { background: radial-gradient(80% 140% at 85% 0%, #ffb48c 0%, rgba(255,180,140,0) 60%), linear-gradient(120deg, #3a1306, #d4673a); }
.b-cobalt { background: radial-gradient(80% 140% at 85% 0%, #7fa4ff 0%, rgba(127,164,255,0) 60%), linear-gradient(120deg, #0a0f3a, #2f45cc); }
.qline { display: block; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; padding: 6px 6px 0; font: 400 19px/1.3 var(--f-body); color: rgba(255,255,255,.82); letter-spacing: -.01em; text-wrap: balance; }
.qline span { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .hpill, .band { transition: transform .2s cubic-bezier(.2,.8,.2,1), background .3s, box-shadow .3s; }
  .hpill:has(.hit:active), .band:active { transform: scale(.98); }
  .hp-c { transition: transform .15s, background .25s, color .2s; }
  .hp-c:active { transform: scale(.85); }
  .enter .hpill, .enter .band, .enter .qline, .enter .impulse, .enter .carousel { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 35ms); }
  .hpill.pop .hp-c { animation: iconpop .5s cubic-bezier(.2,1.6,.4,1); }
}

/* glass sheen on every card */
.tile::before, .pcard::before, .bigc::before, .curve::before, .sum::before, .phase::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 0;
  background: radial-gradient(110% 55% at 22% -8%, rgba(255,255,255,.2), rgba(255,255,255,0) 58%), linear-gradient(180deg, rgba(255,255,255,0) 70%, rgba(255,255,255,.06)); }
.pcard, .curve { box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 1.5px 0 rgba(255,255,255,.28), 0 22px 34px -22px rgba(0,0,0,.95); }
.pcard > *, .curve > * { position: relative; }

/* hero carousel */
.carousel { margin-inline: -20px; overflow-x: auto; overflow-y: visible; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; padding-block: 10px 6px; }
.carousel::-webkit-scrollbar { display: none; }
.ctrack { display: flex; gap: 14px; padding-inline: 13%; width: max-content; }
.bigc { position: relative; isolation: isolate; flex: none; width: min(300px, 74vw); height: 270px; border-radius: 44px; scroll-snap-align: center; overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; padding: 20px 22px 18px; transform-origin: center; will-change: transform;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -30px 50px -24px rgba(255,255,255,.18), 0 30px 50px -26px rgba(0,0,0,.95); }
.bigc > * { position: relative; z-index: 1; }
.bc-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: rgba(255,255,255,.9); }
.bc-ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); }
.bc-num { margin-top: auto; text-align: center; font: 800 76px/1 var(--f-num); text-shadow: 0 0 20px rgba(255,255,255,.4); font-variant-numeric: tabular-nums; }
.bc-unit { text-align: center; font-size: 13px; color: rgba(255,255,255,.8); margin-top: 4px; }
.bc-plot { margin-top: auto; height: 62px; }
.bc-plot svg { width: 100%; height: 100%; display: block; }
.bc-violet { background: radial-gradient(70% 55% at 50% 42%, #23082c 0%, rgba(35,8,44,0) 72%), linear-gradient(165deg, #d46bd9 0%, #8d3fd4 45%, #3a1a7a 100%); }
.bc-teal { background: radial-gradient(70% 55% at 50% 42%, #04201f 0%, rgba(4,32,31,0) 72%), linear-gradient(165deg, #7fe0cf 0%, #1f8f88 45%, #0c3433 100%); }
.bc-sun { background: radial-gradient(70% 55% at 50% 42%, #3a0c14 0%, rgba(58,12,20,0) 72%), linear-gradient(165deg, #f2b06a 0%, #e0507a 50%, #6a1f4a 100%); }
.bc-blue { background: radial-gradient(70% 55% at 50% 42%, #050a26 0%, rgba(5,10,38,0) 72%), linear-gradient(165deg, #8fb0ff 0%, #3a52d8 45%, #10175a 100%); }
.cdots { display: flex; justify-content: center; gap: 6px; }
.cdots i { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.3); transition: width .3s, background .3s; }
.cdots i.on { width: 18px; background: var(--fg); }

/* day phases */
.phases .ctrack { padding-inline: 9%; gap: 12px; }
.phase { position: relative; isolation: isolate; flex: none; width: min(340px, 82vw); min-height: max(430px, min(560px, calc(100vh - 290px))); border-radius: 44px; scroll-snap-align: center; overflow: hidden;
  display: flex; flex-direction: column; padding: 24px 20px 20px; background: var(--pg); transform-origin: center; will-change: transform;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 2px 0 rgba(255,255,255,.25), 0 30px 50px -26px rgba(0,0,0,.95); }
.phase > * { position: relative; z-index: 1; }
.ph-head { display: flex; justify-content: space-between; gap: 10px; }
.ph-head h2 { margin: 0; font: 500 36px/1.05 var(--f-body); letter-spacing: -.02em; }
.ph-head h2 span { display: block; color: rgba(255,255,255,.45); }
.ph-btns { display: flex; flex-direction: column; gap: 8px; }
.ph-btns button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ph-body { flex: 1; display: grid; grid-template-columns: 1fr 34px; gap: 10px; margin-top: 18px; }
.ph-items { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
.ph-item { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; cursor: pointer; padding: 12px 14px; border-radius: 16px;
  background: rgba(30,26,30,.42); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 18px -10px rgba(0,0,0,.6); }
.ph-item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ph-item b { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
.ph-item span { font-size: 11.5px; color: rgba(255,255,255,.75); }
.ph-item .ck { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.7); flex: none; display: grid; place-items: center; }
.ph-item.done .ck { background: var(--fg); color: #111; border-color: var(--fg); }
.ph-item.done b { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.5); }
.ph-line { position: relative; display: flex; flex-direction: column; align-items: center; font: 600 9.5px var(--f-body); color: rgba(255,255,255,.85); letter-spacing: .04em; }
.ph-line .rail { flex: 1; width: 2px; margin: 6px 0; border-radius: 2px; background: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,.9)); position: relative; }
.ph-line .rail i { position: absolute; left: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,.5); }
.ph-line .rail i.on { background: #fff; }
.ph-line .rail em { position: absolute; left: 50%; width: 16px; height: 3px; margin: -1.5px 0 0 -8px; border-radius: 2px; background: var(--signal); box-shadow: 0 0 10px var(--signal); }
.ph-empty { font-size: 13px; color: rgba(255,255,255,.75); padding: 12px 14px; border-radius: 16px; background: rgba(30,26,30,.3); }


/* bottom glass tab bar */
.brand { flex: 1; text-align: center; font: 500 15px var(--f-body); letter-spacing: .02em; color: rgba(255,255,255,.85); }
.phone { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.tabbar { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 8; display: flex; justify-content: center; padding-inline: 16px; pointer-events: none; }
.tb-glass { pointer-events: auto; position: relative; width: min(320px, 100%); display: grid; grid-template-columns: repeat(4, 1fr); padding: 7px; border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.07)); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -8px 18px -10px rgba(255,255,255,.18), 0 20px 44px -14px rgba(0,0,0,.75); }
.tb-glass::after { content: ""; position: absolute; inset: 1px 10% auto; height: 45%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.14), transparent); filter: blur(3px); pointer-events: none; }
.tb-glass button { position: relative; z-index: 1; height: 54px; border: 0; background: transparent; display: grid; place-items: center; color: rgba(255,255,255,.82); cursor: pointer; padding: 0; transition: color .3s; }
.tb-glass button[aria-selected="true"] { color: #121216; }
.tb-ind { position: absolute; top: 7px; left: 7px; height: 54px; width: calc((100% - 14px) / 4); transform: translateX(calc(var(--i, 0) * 100%)); pointer-events: none; }
.tb-ind::before { content: ""; position: absolute; inset: 0; margin: auto; width: 54px; height: 54px; border-radius: 50%;
  background: radial-gradient(circle at 35% 28%, #ffffff, #ecebf1 55%, #c9c9d4); box-shadow: 0 8px 18px rgba(0,0,0,.4), inset 0 -3px 6px rgba(0,0,0,.12), inset 0 2px 2px rgba(255,255,255,.9); }
@media (prefers-reduced-motion: no-preference) {
  .tb-ind { transition: transform .6s cubic-bezier(.34,1.5,.5,1); }
  .tb-ind.squish::before { animation: squish .6s cubic-bezier(.3,.8,.3,1); }
  .tb-glass button[aria-selected="true"] svg { animation: iconpop .5s cubic-bezier(.2,1.6,.4,1); }
  .tb-glass button:active svg { transform: scale(.85); }
  .tb-glass button svg { transition: transform .15s; }
  #view.slide-r { animation: slideR .45s cubic-bezier(.2,.8,.2,1); }
  #view.slide-l { animation: slideL .45s cubic-bezier(.2,.8,.2,1); }
}
@keyframes squish { 25% { transform: scale(1.32, .82); } 55% { transform: scale(.94, 1.06); } 100% { transform: none; } }
@keyframes iconpop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } }
@keyframes slideR { from { transform: translateX(36px); opacity: 0; } }
@keyframes slideL { from { transform: translateX(-36px); opacity: 0; } }

/* calendar header */
.calhead { position: relative; overflow: hidden; border-radius: 38px; padding: 20px 16px 14px;
  background: radial-gradient(120% 95% at 105% -5%, #2a98a0 0%, rgba(42,152,160,0) 58%), radial-gradient(110% 100% at -5% 105%, #f2a27c 0%, rgba(242,162,124,0) 60%), radial-gradient(70% 70% at 55% 95%, #b8578d 0%, rgba(184,87,141,0) 70%), #14161c; }
.calhead .ch-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding-inline: 6px; }
.calhead h1 { font: 400 38px/1 var(--f-body); letter-spacing: -.02em; margin: 0; }
.calhead .ch-sub { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 6px; }
.calhead .ch-nav { display: flex; gap: 6px; }
.calhead .ch-nav button { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.55); background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; }
.calhead .ch-nav button:disabled { opacity: .3; }
.cal7 { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 8px; margin-top: 18px; text-align: center; }
.cal7 .wd { font-size: 11px; letter-spacing: .08em; color: rgba(255,255,255,.62); }
.cal7 button { width: 100%; max-width: 46px; aspect-ratio: 1; justify-self: center; border-radius: 50%; border: 0; background: transparent; font: 500 15px var(--f-body); cursor: pointer; position: relative; padding: 0; }
.cal7 button[aria-pressed="true"] { background: var(--fg); color: #111; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.cal7 button:disabled { opacity: .38; cursor: default; }
.cal7 .pip { position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--signal); }
.cal7 button[aria-pressed="true"] .pip { background: #111; }

/* impulse pill */
.impulse { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; text-align: left; cursor: pointer; padding: 18px 20px; border-radius: 999px;
  background: linear-gradient(100deg, #a52c9a 0%, #dc4a8f 45%, #f09a86 100%); font-size: 14.5px; line-height: 1.3; box-shadow: 0 14px 30px -18px #dc4a8f; }
.impulse .grow { flex: 1; min-width: 0; }
.impulse svg { flex: none; }

/* big views */
.sheet.full { height: calc(100% - 20px); max-height: none; }
.sheet.magenta { background: radial-gradient(60% 34% at 50% 26%, #3d0a24 0%, #dc308f 52%, #d0a8c9 100%); }
.sheet.sunset { background: radial-gradient(90% 50% at 70% 20%, #d6457f 0%, rgba(214,69,127,0) 70%), linear-gradient(172deg, #c9733b 0%, #d64d7c 38%, #e8a487 70%, #efe3b4 100%); }
.sheet.ocean { background: radial-gradient(60% 34% at 50% 26%, #050a26 0%, #2e48c8 60%, #457bf1 100%); }
.hugenum { font: 800 96px/1 var(--f-num); text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; text-shadow: 0 0 22px rgba(255,255,255,.35); }
.unitlbl { text-align: center; font-size: 15px; color: rgba(255,255,255,.85); margin-top: 4px; }
.ask { font: 400 30px/1.12 var(--f-body); letter-spacing: -.02em; margin: 4px 2px 0; text-wrap: balance; }
.hint { margin: 0 2px; font-size: 13px; color: rgba(255,255,255,.75); }
.ghostcirc { width: 58px; height: 58px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.55); background: rgba(255,255,255,.08); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
.ghostcirc.sm { width: 40px; height: 40px; }
.amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.amount { display: flex; align-items: center; gap: 10px; border-radius: 40px; padding: 10px 10px 10px 18px; cursor: pointer; text-align: left;
  background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
.amount .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.amount b { font: 800 24px/1 var(--f-num); }
.amount b small { font: 500 11px var(--f-body); margin-left: 2px; }
.amount span { font-size: 12px; color: rgba(255,255,255,.85); }
.pillcta { display: flex; align-items: center; justify-content: space-between; gap: 12px; align-self: center; min-width: 210px; border: 0; cursor: pointer;
  border-radius: 999px; padding: 7px 7px 7px 22px; font-size: 15px; background: rgba(40,10,30,.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.pillcta .plus { width: 40px; height: 40px; border-radius: 50%; background: var(--fg); color: #111; display: grid; place-items: center; }
.pillcta.dark { background: rgba(10,8,30,.55); border: 1px solid rgba(255,255,255,.12); flex: 1; }
.panel { background: rgba(8,8,12,.55); border: 1px solid rgba(255,255,255,.1); border-radius: 28px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.center { justify-content: center; }

/* ruler slider */
.rswrap { position: relative; }
.rswrap::before { content: ""; position: absolute; left: 50%; top: 0; z-index: 2; transform: translateX(-6px); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--signal); pointer-events: none; }
.rswrap::after { content: ""; position: absolute; left: 50%; top: 6px; z-index: 2; width: 3px; height: 40px; margin-left: -1.5px; border-radius: 2px; background: var(--signal); box-shadow: 0 0 10px rgba(230,238,108,.7); pointer-events: none; }
.rs { height: 70px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); cursor: grab; }
.rs::-webkit-scrollbar { display: none; }
.rs .track { display: flex; height: 100%; width: max-content; }
.rs .pad { flex: none; height: 100%; }
.rs .s { flex: none; width: var(--sp); height: 100%; position: relative; scroll-snap-align: center; cursor: pointer; }
.rs .s::after { content: ""; position: absolute; left: 50%; top: 14px; width: 1.5px; height: 18px; margin-left: -.75px; background: rgba(255,255,255,.5); border-radius: 1px; }
.rs .s.major::after { height: 28px; top: 9px; background: rgba(255,255,255,.95); }
.rs .s em { position: absolute; left: 50%; top: 46px; transform: translateX(-50%); font: 600 10px var(--f-num); font-style: normal; color: rgba(255,255,255,.75); white-space: nowrap; }

/* focus running */
.orbwrap { position: relative; width: min(300px, 82vw); aspect-ratio: 1; align-self: center; }
.orbwrap canvas { width: 100%; height: 100%; display: block; }
.orbwrap .countdown { position: absolute; inset: 0; display: grid; place-content: center; }
.orbwrap .hugenum { font-size: 72px; }
.fpanel { border-radius: 36px; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 16px;
  background: radial-gradient(80% 90% at 50% 0%, #6b55d8 0%, #2a2a8c 45%, #0d0e3a 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.fpanel .r3 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; }
.fpanel .r3 div { display: flex; flex-direction: column; gap: 1px; }
.fpanel .r3 div:last-child { text-align: right; }
.fpanel .r3 b { font: 600 16px var(--f-body); }
.fpanel .r3 span { font-size: 11px; color: rgba(255,255,255,.6); }
.fpanel .mid { text-align: center; font-size: 13px; color: rgba(255,255,255,.85); align-items: center; }
.prog { position: relative; height: 34px; }
.prog::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px dotted rgba(255,255,255,.3); }
.prog i { position: absolute; left: 0; top: 50%; height: 2.5px; margin-top: -1.25px; background: var(--signal); border-radius: 2px; box-shadow: 0 0 8px rgba(230,238,108,.6); }
.prog b { position: absolute; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #c9c9d6 60%, #8d8da8); box-shadow: 0 0 0 5px rgba(255,255,255,.12), 0 4px 12px rgba(0,0,0,.4); }
.fpanel .r2 { display: flex; gap: 10px; align-items: center; }

/* week curve + pill cards */
.curve { border-radius: 40px; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden;
  background: radial-gradient(90% 60% at 50% 105%, #3fa2b4 0%, rgba(63,162,180,0) 70%), radial-gradient(60% 70% at 105% 60%, #6b4b7c 0%, rgba(107,75,124,0) 70%), linear-gradient(180deg, #1d2333, #182434); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.curve h2 { margin: 0 4px; font: 400 19px var(--f-body); }
.curve svg { width: 100%; height: auto; display: block; overflow: visible; }
.curve .dsel { display: grid; grid-template-columns: repeat(7, 1fr); }
.curve .dsel button { width: 34px; height: 34px; justify-self: center; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: transparent; font-size: 11px; cursor: pointer; padding: 0; }
.curve .dsel button[aria-pressed="true"] { background: var(--fg); color: #111; border-color: var(--fg); }
.curve .dsel button:disabled { opacity: .3; cursor: default; }
.curve .range { display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 13px; color: rgba(255,255,255,.8); }

    const t = seed(id) % 5; let s = "";
    for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
      const dx = x - 2, dy = y - 2, d = Math.hypot(dx, dy), m = Math.abs(dx) + Math.abs(dy); let r = 0;
      if (t === 0) r = d <= 2.3 ? 4 - d * 1.25 : 0;
      else if (t === 1) r = Math.abs(d - 2) < .5 ? 2.6 : d === 0 ? 3.4 : 0;
      else if (t === 2) r = dx === 0 || dy === 0 ? 3.6 - (Math.abs(dx) + Math.abs(dy)) * .6 : 1;
      else if (t === 3) r = m <= 2 ? 3.8 - m * .8 : 1;
      else r = x % 2 === 0 ? 1.6 + (2 - Math.abs(dy)) * .8 : 1;
      if (r > 0) s += `<circle cx="${10 + x * 10}" cy="${10 + y * 10}" r="${r.toFixed(2)}"/>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 60 60" fill="${on ? "#fff" : "rgba(255,255,255,.32)"}" aria-hidden="true"${on ? ' style="filter:drop-shadow(0 0 6px rgba(255,255,255,.55))"' : ""}>${s}</svg>`;
  }
  function ruler(val, max) {
    const p = Math.max(0, Math.min(100, val / max * 100));

  }
  function aura(level) {
    let s = "";

      s += `<circle cx="48" cy="48" r="${18 + i * 5.6}" fill="none" stroke="${lit ? "rgba(255,255,255,.8)" : "rgba(255,255,255,.16)"}" stroke-width="${lit ? 1.4 : 1}"/>`;
    }
    return `<svg class="aura" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="17" fill="rgba(0,0,0,.35)"/>${s}</svg>`;
  }
  function dial() {
    const n = new Date(), lit = Math.floor((n.getHours() * 60 + n.getMinutes()) / 1440 * 60);
    let t = "";
    for (let i = 0; i < 60; i++) {
      const a = i / 60 * Math.PI * 2 - Math.PI / 2, r1 = 46, r2 = i % 5 === 0 ? 38 : 41;
      const hot = i < lit && i >= lit - 4;
      const col = hot ? "#e6ee6c" : i < lit ? "rgba(255,255,255,.85)" : "rgba(255,255,255,.2)";
      t += `<line x1="${(50 + Math.cos(a) * r1).toFixed(1)}" y1="${(50 + Math.sin(a) * r1).toFixed(1)}" x2="${(50 + Math.cos(a) * r2).toFixed(1)}" y2="${(50 + Math.sin(a) * r2).toFixed(1)}" stroke="${col}" stroke-width="${hot ? 2 : 1.1}" stroke-linecap="round"/>`;
    }
    return `<svg width="84" height="84" viewBox="0 0 100 100" aria-hidden="true">${t}<circle cx="50" cy="50" r="22" fill="#eeedf2"/><circle cx="50" cy="50" r="2.5" fill="#888"/></svg>`;
  }
  function ringSvg(p, size, r, w) {
    const C = 2 * Math.PI * r, c = size / 2;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#e6ee6c" stroke-width="${w}" stroke-linecap="round"
        stroke-dasharray="${(C * p / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/></svg>`;
  }

  function render() {
    const v = document.getElementById("view");
    const active = document.activeElement && document.activeElement.id;
    const draft = active === "noteInput" || active === "noteInput2" ? document.activeElement.value : null;
    v.classList.remove("enter");
    v.querySelectorAll(".carousel").forEach(c => { carPos[c.id] = c.scrollLeft; });
    v.innerHTML = tab === "heute" ? viewHeute() : tab === "ablauf" ? viewAblauf() : tab === "woche" ? viewWoche() : viewJournal();
    initCarousels(v);
    if (animateNext) {
      animateNext = false;
      let i = 0;
      v.querySelectorAll(".head, .calhead, .carousel, .impulse, .label, .tile, .hpill, .band, .qline, .pcard, .curve").forEach(el => el.style.setProperty("--i", Math.min(i++, 12)));
      if (!calm) v.querySelectorAll(".bc-num, .bigpct").forEach(el => {
        const txt = el.textContent.trim(), m = txt.match(/^(\d+)$/); if (!m) return;
        const to = +m[1], t0 = performance.now(), dur = 700;
        const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(to * e); if (p < 1) requestAnimationFrame(step); };
        el.textContent = "0"; requestAnimationFrame(step);
      });
      v.querySelectorAll(".bar b").forEach((el, j) => el.style.setProperty("--b", j));
      void v.offsetWidth; v.classList.add("enter");
      clearTimeout(enterTimer); enterTimer = setTimeout(() => v.classList.remove("enter"), 1600);
    }
    if (popKey) { const el = v.querySelector(`[data-tile="${popKey}"]`); if (el) el.classList.add("pop"); popKey = null; }
    if (draft !== null) { const el = document.getElementById(active); if (el) { el.value = draft; el.focus({ preventScroll: true }); } }
    document.querySelectorAll(".tb-glass [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
    const ti = TABS.indexOf(tab), ind = document.getElementById("tbInd");
    ind.style.setProperty("--i", ti);
    document.getElementById("brand").textContent = { heute: "Heute", ablauf: "Ablauf", woche: "Woche", journal: "Journal" }[tab];
    if (tab !== shownTab) {
      const dir = ti > TABS.indexOf(shownTab) ? "slide-r" : "slide-l";
      v.classList.remove("slide-r", "slide-l"); ind.classList.remove("squish");
      void v.offsetWidth;
      v.classList.add(dir); ind.classList.add("squish");
      shownTab = tab;
    }
    const tp = pct(todayKey());
    if (tp !== lastRing) { lastRing = tp; document.getElementById("ringBtn").innerHTML = ringSvg(tp, 46, 21, 2) + `<b>${tp}</b>`; }
    document.getElementById("liveDot").classList.toggle("on", !!day(todayKey()).focusStart);
    renderSheet();
    scrollFx();
  }

  // ---------- live ticking ----------
  function tickFocusView() {
    const d = day(todayKey()), c = document.getElementById("fcCount");
    if (!c || !d.focusStart) return;
    c.textContent = d.focusPlan ? mmss(focusLeft(d)) : mmss(Date.now() - d.focusStart);
    const p = d.focusPlan ? Math.min(1, (Date.now() - d.focusStart) / (d.focusPlan * 60000)) : 0;
    const f = document.getElementById("fcFill"), kn = document.getElementById("fcKnob");
    if (f) f.style.width = (p * 100).toFixed(2) + "%";
    if (kn) kn.style.left = (p * 100).toFixed(2) + "%";
  }
  let lastMin = -1, lastDay = todayKey();
  setInterval(() => {
    const now = new Date();
    if (keyOf(now) !== lastDay) { if (selected === lastDay) selected = keyOf(now); lastDay = keyOf(now); render(); return; }
    const td = day(todayKey());
    if (td.focusStart && td.focusPlan && focusLeft(td) <= 0) {
      finishFocus(todayKey(), true); chime();
      try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {}
      if (sheet && sheet.type === "focus") sheet.msg = "Session geschafft. Kurz durchatmen, Wasser trinken.";
      popKey = "focus"; render(); return;
    }
    const d = day(selected);
    const fs = document.getElementById("focusSub");
    if (fs && d.focusStart) fs.textContent = d.focusPlan ? "noch " + mmss(focusLeft(d)) : Math.floor(focusTotal(selected)) + " min · seit " + fmtClock(d.focusStart);
    tickFocusView();
    if (now.getMinutes() !== lastMin) {
      lastMin = now.getMinutes();
      const set = (id, v, html) => { const el = document.getElementById(id); if (el) el[html ? "innerHTML" : "textContent"] = v; };
      set("clock", fmtClock(now)); set("dayLeft", dayLeft()); set("dayPct", "Tag zu " + dayPct() + " %"); set("dial", dial(), true);
    }
  }, 1000);

  // ---------- actions ----------
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const byId = (arr, id) => arr.find(x => x.id === id);
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act], [data-day], [data-tab]");
    if (!b) return;
    const act = b.dataset.act, k = selected, n = Number(b.dataset.n), id = b.dataset.id;
    if (!act && b.dataset.day) { if (selected !== b.dataset.day) animateNext = true; selected = b.dataset.day; render(); return; }
    if (!act && b.dataset.tab) { if (tab !== b.dataset.tab) animateNext = true; tab = b.dataset.tab; render(); window.scrollTo({ top: 0 }); return; }
    const tileEl = b.closest("[data-tile]");
    if (tileEl && !sheet && ["toggle", "ml", "focus"].includes(act)) popKey = tileEl.dataset.tile;
    switch (act) {
      case "open": sheet = { type: b.dataset.sheet, id, platform: "Instagram", msg: "" }; break;
      case "toggle": { const d = ensureDay(k); if (d.done[id]) delete d.done[id]; else d.done[id] = true; save(k); break; }
      case "ml": { const d = ensureDay(k); d.waterMl = clamp(waterMl(k) + n, 0, 10000); delete d.water; save(k); break; }
      case "weeknav": { const nk = addDays(selected, n * 7), t = todayKey(); selected = nk > t ? t : nk; animateNext = true; break; }
      case "fcpreset": { const el = document.getElementById("fcPlan"); if (el && el.setSlider) el.setSlider(n); return; }
      case "focus-start": startFocus(k); if (sheet) sheet.msg = ""; break;
      case "focus-cancel": { const d = ensureDay(k); d.focusStart = null; d.focusPlan = null; save(k); break; }
      case "setmood": { const d = ensureDay(k); d.mood = d.mood === n ? 0 : n; save(k); break; }
      case "focus": { const d = ensureDay(k); if (d.focusStart) finishFocus(k, false); else startFocus(k); if (sheet) sheet.msg = ""; break; }
      case "focus-add": {
        const d = ensureDay(k), now = Date.now();
        d.sessions ||= [];
        d.focusMin = (d.focusMin || 0) + n;
        d.sessions.push({ id: uid(), s: now - n * 60000, e: now, manual: true });
        save(k); break;
      }
      case "focus-del": {
        const d = ensureDay(k), s = byId(d.sessions || [], id);
        if (s) { d.focusMin = Math.max(0, (d.focusMin || 0) - (s.e - s.s) / 60000); d.sessions = d.sessions.filter(x => x !== s); save(k); }
        break;
      }
      case "quote": quoteOffset++; break;
      case "tab": tab = b.dataset.tab; sheet = null; animateNext = true; window.scrollTo({ top: 0 }); break;
      case "go": selected = b.dataset.day; tab = "heute"; animateNext = true; window.scrollTo({ top: 0 }); break;
      case "del-note": { const dk = b.dataset.day, d = ensureDay(dk); d.notes = d.notes.filter(x => x.id !== id); save(dk); break; }
      case "edit-habits": sheet = { type: "edit", msg: "" }; break;
      case "install": if (window.__twInstall) { window.__twInstall.prompt(); window.__twInstall.userChoice.finally(() => { window.__twInstall = null; render(); }); } return;
      case "export": {
        try {
          const blob = new Blob([JSON.stringify({ app: "tagwerk", v: 1, exportedAt: new Date().toISOString(), config, days, biz }, null, 1)], { type: "application/json" });
          const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tagwerk-backup-" + todayKey() + ".json";
          document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
          sheet.msg = "Backup gespeichert.";
        } catch (er) { sheet.msg = "Das Speichern hat nicht geklappt."; }
        break;
      }
      case "habit": sheet = { type: "habit", id }; break;
      case "close": sheet = null; break;
      case "close-scrim": if (e.target !== b) return; sheet = null; break;
      case "rm-habit": config.habits = config.habits.filter(h => h.id !== id); save("config"); if (sheet && sheet.type === "habit") sheet = null; break;
      case "move": { const i = config.habits.findIndex(h => h.id === id); if (i > 0) { const [h] = config.habits.splice(i, 1); config.habits.splice(i - 1, 0, h); save("config"); } break; }
      case "phase": { const h = byId(config.habits, id); if (h) { h.phase = b.dataset.p; save("config"); } break; }
      case "color": { const h = byId(config.habits, id); if (h) { h.color = b.dataset.c; save("config"); } break; }
      case "goal": config.waterGoalMl = clamp(goalMl() + n * 250, 1000, 5000); save("config"); break;
      case "postgoal": config.postGoal = clamp((config.postGoal || 4) + n, 1, 21); save("config"); break;
      case "end": config.endHour = clamp((config.endHour || 19) + n, 12, 23); save("config"); break;
      case "rm-quote": config.quotes = config.quotes.filter(q => q.id !== id); save("config"); break;
      case "platform": sheet.platform = b.dataset.p; break;
      case "rm-post": { const dk = b.dataset.day, d = ensureDay(dk); d.posts = (d.posts || []).filter(p => p.id !== id); save(dk); break; }
      case "stage": { const p = byId(biz.pipeline, id); if (p) { p.stage = clamp(p.stage + n, 0, 3); save("biz"); } break; }
      case "rm-idea": biz.pipeline = biz.pipeline.filter(p => p.id !== id); save("biz"); break;
      case "rm-shoot": biz.shoots = biz.shoots.filter(s => s.id !== id); save("biz"); break;
      case "rm-offer": biz.offers = biz.offers.filter(o => o.id !== id); save("biz"); break;
      case "offer-status": { const o = byId(biz.offers, id); if (o) { o.status = (o.status + 1) % 3; save("biz"); } break; }
      default: return;
    }
    render();
  });
  document.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    const field = x => f.querySelector("#" + x);
    const val = x => (field(x) ? field(x).value.trim() : "");
    const clear = (...xs) => xs.forEach(x => { if (field(x)) field(x).value = ""; });
    let refocus = null;
    switch (f.dataset.form) {
      case "note": {
        const el = f.querySelector("input"), text = el.value.trim();
        if (!text) return;
        ensureDay(selected).notes.push({ id: "n" + uid(), at: Date.now(), text: text.slice(0, 500) });
        save(selected); el.value = ""; refocus = el.id; break;
      }
      case "habit": { const t = val("habitInput"); if (!t) return; config.habits.push({ id: "h" + uid(), name: t.slice(0, 60) }); save("config"); clear("habitInput"); refocus = "habitInput"; break; }
      case "rename": { const t = val("renameInput"), h = sheet && byId(config.habits, sheet.id); if (!t || !h) return; h.name = t.slice(0, 60); save("config"); break; }
      case "moodnote": { const d = ensureDay(selected); d.moodNote = val("moodNote").slice(0, 120); save(selected); break; }
      case "quote": { const t = val("quoteInput"); if (!t) return; config.quotes.push({ id: uid(), text: t.slice(0, 200) }); save("config"); clear("quoteInput"); refocus = "quoteInput"; break; }
      case "post": {
        const d = ensureDay(selected); d.posts ||= [];
        d.posts.push({ id: uid(), at: Date.now(), platform: (sheet && sheet.platform) || "Instagram", title: (val("postInput") || "Ohne Titel").slice(0, 100) });
        save(selected); clear("postInput"); break;
      }
      case "idea": { const t = val("ideaInput"); if (!t) return; biz.pipeline.push({ id: uid(), title: t.slice(0, 100), stage: 0 }); save("biz"); clear("ideaInput"); refocus = "ideaInput"; break; }
      case "shoot": {
        const dt = val("shootDate"), c = val("shootClient");
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) { field("shootDate").focus(); return; }
        if (!c) { field("shootClient").focus(); return; }
        const tm = val("shootTime");
        biz.shoots.push(Object.assign({ id: uid(), date: dt, client: c.slice(0, 80) }, /^\d{2}:\d{2}$/.test(tm) ? { time: tm } : {}));
        save("biz"); clear("shootClient", "shootTime");
        if (sheet) sheet.msg = "Gespeichert. Tipp auf „In Google“, um ihn auch in deinen Kalender zu legen.";
        break;
      }
      case "offer": {
        const c = val("offerClient"), a = parseFloat(val("offerAmount").replace(/\./g, "").replace(",", "."));
        if (!c) { field("offerClient").focus(); return; }
        if (!(a >= 0)) { field("offerAmount").focus(); return; }
        biz.offers.push({ id: uid(), client: c.slice(0, 80), amount: a, status: 0, at: todayKey() }); save("biz"); clear("offerClient", "offerAmount"); break;
      }
      default: return;
    }
    render();
    if (refocus) { const el = document.getElementById(refocus); if (el) el.focus({ preventScroll: true }); }
  });
  function installHtml() {
    const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
    if (standalone) return '<p class="empty" style="margin:0">Tagwerk ist auf diesem Gerät installiert.</p>';
    if (window.__twInstall) return '<button class="cta" data-act="install">Auf den Home-Bildschirm</button>';
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    return `<p class="empty" style="margin:0">${ios ? "In Safari unten auf Teilen tippen, dann „Zum Home-Bildschirm“." : "Im Browser-Menü „App installieren“ oder „Zum Startbildschirm hinzufügen“ wählen."}</p>`;
  }
  window.addEventListener("tw-install", () => { const bx = document.getElementById("installBox"); if (bx) bx.innerHTML = installHtml(); });
  document.addEventListener("change", e => {
    if (e.target.id === "importFile" && e.target.files && e.target.files[0]) {
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const o = JSON.parse(String(rd.result));
          if (!o || o.app !== "tagwerk" || !o.config || !Array.isArray(o.config.habits)) throw new Error("format");
          config = o.config; days = o.days || {}; biz = o.biz || clone(DEFAULT_BIZ); cfg(); saveLocal();
          if (sheet) sheet.msg = "Backup vom " + (o.exportedAt || "").slice(0, 10) + " wiederhergestellt."; animateNext = true;
        } catch (er) { if (sheet) sheet.msg = "Diese Datei ist kein Tagwerk-Backup."; }
        render();
      };
      rd.readAsText(e.target.files[0]);
      return;
    }
    if (e.target.id !== "icsFile" || !e.target.files || !e.target.files[0]) return;
    const kwEl = document.getElementById("shootKeyword"), kw = (kwEl ? kwEl.value : "").trim().toLowerCase();
    if (config.shootKeyword !== kw) { config.shootKeyword = kwEl ? kwEl.value.trim() : ""; save("config"); }
    const file = e.target.files[0], reader = new FileReader();
    reader.onload = () => {
      const from = addDays(todayKey(), -30), have = new Set(biz.shoots.map(s => s.uid).filter(Boolean));
      const evs = parseIcs(String(reader.result)).filter(ev => ev.date >= from && (!kw || (ev.summary || "").toLowerCase().includes(kw)));
      let added = 0;
      for (const ev of evs.slice(0, 300)) {
        const key = ev.uid ? ev.uid + "@" + ev.date : null;
        if (key && have.has(key)) continue;
        biz.shoots.push(Object.assign({ id: uid(), date: ev.date, client: (ev.summary || "Termin").slice(0, 80) }, ev.time ? { time: ev.time } : {}, key ? { uid: key } : {}));
        if (key) have.add(key);
        added++;
      }
      if (added) save("biz");
      if (sheet) sheet.msg = added ? added + (added === 1 ? " Termin" : " Termine") + " importiert." : "Keine neuen Termine gefunden" + (kw ? " mit „" + config.shootKeyword + "“." : ".");
      render();
    };
    reader.onerror = () => { if (sheet) sheet.msg = "Die Datei konnte nicht gelesen werden."; render(); };
    reader.readAsText(file);
  });
  let sw = null;
  const viewEl = document.getElementById("view");
  viewEl.addEventListener("touchstart", e => {
    if (sheet || e.touches.length !== 1 || e.target.closest(".matrix, .rs, input, .cal7, .carousel")) { sw = null; return; }
    sw = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  viewEl.addEventListener("touchend", e => {
    if (!sw) return;
    const dx = e.changedTouches[0].clientX - sw.x, dy = e.changedTouches[0].clientY - sw.y; sw = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 45) return;
    const ni = TABS.indexOf(tab) + (dx < 0 ? 1 : -1);
    if (ni < 0 || ni >= TABS.length) return;
    tab = TABS[ni]; animateNext = true; render(); window.scrollTo({ top: 0 });
  }, { passive: true });
  document.getElementById("todayBtn").addEventListener("click", () => { selected = todayKey(); tab = "heute"; animateNext = true; render(); window.scrollTo({ top: 0 }); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet) { sheet = null; render(); } });

  connect();
})();
</script>

<script>
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/tagwerk/sw.js", { scope: "/tagwerk/" }).catch(() => {}));
</script>
</body>
