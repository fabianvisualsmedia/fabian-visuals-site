<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tests · Footage Tracker</title>
  <style>
    body { margin: 0; padding: 32px 20px; background: #050506; color: #f4f4f6; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.02em; }
    #summary { color: rgba(244,244,246,.6); margin-bottom: 24px; }
    #summary.ok { color: #4ADE80; } #summary.fail { color: #FF5A47; }
    ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    li { padding: 12px 16px; border-radius: 16px; background: #0E0F12; border: 1px solid rgba(255,255,255,.07); }
    li.ok::before { content: "✓ "; color: #4ADE80; font-weight: 700; }
    li.fail { border-color: rgba(255,90,71,.5); }
    li.fail::before { content: "✗ "; color: #FF5A47; font-weight: 700; }
    li.skip { opacity: .5; } li.skip::before { content: "– "; }
    small { display: block; color: rgba(244,244,246,.55); margin-top: 2px; white-space: pre-wrap; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: rgba(244,244,246,.4); margin: 26px 0 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Footage Tracker · Tests</h1>
    <p id="summary">läuft …</p>
    <div id="out"></div>
  </main>
  <script type="module" src="tests.js"></script>
</body>
</html>
