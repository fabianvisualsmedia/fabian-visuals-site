<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shoot Day Tests</title>
  <style>
    body { font: 15px/1.5 -apple-system, system-ui, sans-serif; background: #0b0c10; color: #eee; padding: 24px; max-width: 900px; }
    h2 { font-size: 15px; color: #8a8f9c; margin: 22px 0 4px; text-transform: uppercase; letter-spacing: .06em; }
    ul { padding: 0; margin: 0; }
    li { list-style: none; padding: 3px 0; }
    .pass::before { content: "✓ "; color: #3ddc84; }
    .fail::before { content: "✗ "; color: #ff4d5e; }
    .skip::before { content: "– "; color: #ffb923; }
    .fail { color: #ff8a95; }
    .skip { color: #ffcf6b; }
    #summary { font-weight: 600; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Shoot Day – Tests</h1>
  <p id="summary">läuft …</p>
  <div id="out"></div>
  <script type="module">
    import { durationMin, daysUntil, addDaysISO, esc, parseDateTime } from '../js/ui.js';
    import { bucketShoots } from '../js/views/shoots-list.js';
    import * as db from '../js/db.js';
    import { sunTimes, sunPosition, compass } from '../js/logic/sun.js';
    import { videoGB, planCards, calcStorage, calcBatteries } from '../js/logic/power-storage.js';
    import { departure, bufferMinutes } from '../js/logic/travel.js';
    import { autoItems, mergeChecklist, keyOf } from '../js/logic/packlist.js';
    import { parseHourly, summarize, hoursForShoot, loadWeather } from '../js/logic/weather.js';
    import { setFetch } from '../js/logic/net.js';
    import { cityFromAddress } from '../js/logic/geocode.js';
    import { computeAutopilot } from '../js/logic/autopilot.js';
    import { DEFAULT_GEAR } from '../js/data/default-gear.js';
    import { DEFAULT_TEMPLATES } from '../js/data/default-templates.js';

    const results = [];
    let group = '';
    const section = (name) => { group = name; };
    async function test(name, fn) {
      try {
        const r = await fn();
        results.push({ group, name, status: r === 'skip' ? 'skip' : 'pass' });
      } catch (e) { results.push({ group, name, status: 'fail', msg: e.message }); }
    }
    const eq = (a, b, msg = '') => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg} erwartet ${JSON.stringify(b)}, bekommen ${JSON.stringify(a)}`); };
    const ok = (cond, msg) => { if (!cond) throw new Error(msg); };
    const near = (a, b, tol, msg) => { if (Math.abs(a - b) > tol) throw new Error(`${msg}: ${a.toFixed(1)} vs ${b.toFixed(1)} (±${tol})`); };
    const isBerlin = Intl.DateTimeFormat().resolvedOptions().timeZone === 'Europe/Berlin';
    const utcMin = (d) => d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60;

    // ---------- Independent reference: NOAA Solar Calculator (spreadsheet formulas) ----------
    // Returns sunrise/sunset in minutes after 00:00 UTC for the given date.
    function noaaSun(y, m, d, lat, lon) {
      const r = Math.PI / 180, deg = 180 / Math.PI;
      const jd = Date.UTC(y, m - 1, d, 12) / 864e5 + 2440587.5;
      const T = (jd - 2451545) / 36525;
      const L0 = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;
      const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
      const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
      const C = Math.sin(M * r) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M * r) * (0.019993 - 0.000101 * T) + Math.sin(3 * M * r) * 0.000289;
      const appLong = L0 + C - 0.00569 - 0.00478 * Math.sin((125.04 - 1934.136 * T) * r);
      const obl0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
      const obl = obl0 + 0.00256 * Math.cos((125.04 - 1934.136 * T) * r);
      const dec = Math.asin(Math.sin(obl * r) * Math.sin(appLong * r)) * deg;
      const yv = Math.tan((obl / 2) * r) ** 2;
      const eqt = 4 * deg * (yv * Math.sin(2 * L0 * r) - 2 * e * Math.sin(M * r) + 4 * e * yv * Math.sin(M * r) * Math.cos(2 * L0 * r)
        - 0.5 * yv * yv * Math.sin(4 * L0 * r) - 1.25 * e * e * Math.sin(2 * M * r));
      const ha = Math.acos(Math.cos(90.833 * r) / (Math.cos(lat * r) * Math.cos(dec * r)) - Math.tan(lat * r) * Math.tan(dec * r)) * deg;
      const noon = 720 - 4 * lon - eqt;
      return { sunrise: noon - 4 * ha, sunset: noon + 4 * ha, noon };
    }

    const BONN = [50.7374, 7.0982];

    section('Sonnenstand (Bonn)');
    for (const [label, y, m, d] of [['21.06.', 2026, 6, 21], ['21.12.', 2026, 12, 21], ['Zeitumstellung 29.03.', 2026, 3, 29], ['Zeitumstellung 25.10.', 2026, 10, 25]]) {
      await test(`${label}: Auf-/Untergang ±2 min vs. NOAA`, () => {
        const ref = noaaSun(y, m, d, ...BONN);
        const t = sunTimes(new Date(Date.UTC(y, m - 1, d, 11)), ...BONN);
        near(utcMin(t.sunrise), ref.sunrise, 2, 'Sonnenaufgang');
        near(utcMin(t.sunset), ref.sunset, 2, 'Sonnenuntergang');
        near(utcMin(t.solarNoon), ref.noon, 2, 'Mittag');
      });
    }
    // Plausibility vs. published almanac values for Bonn (approx., MESZ/MEZ): 21.06. ≈ 05:19 / 21:51, 21.12. ≈ 08:28 / 16:30.
    await test('Plausibel ggü. Almanach (±5 min)', () => {
      const s = sunTimes(new Date(Date.UTC(2026, 5, 21, 11)), ...BONN);
      near(utcMin(s.sunrise), 3 * 60 + 19, 5, '21.06. Aufgang (UTC)');
      near(utcMin(s.sunset), 19 * 60 + 51, 5, '21.06. Untergang (UTC)');
      const w = sunTimes(new Date(Date.UTC(2026, 11, 21, 11)), ...BONN);
      near(utcMin(w.sunrise), 7 * 60 + 28, 5, '21.12. Aufgang (UTC)');
      near(utcMin(w.sunset), 15 * 60 + 30, 5, '21.12. Untergang (UTC)');
    });
    await test('Golden/Blue Hour in richtiger Reihenfolge', () => {
      const s = sunTimes(new Date(Date.UTC(2026, 8, 12, 11)), ...BONN);
      const seq = [s.dawn, s.blueMorning[1], s.sunrise, s.goldenMorning[1], s.solarNoon, s.goldenEvening[0], s.sunset, s.blueEvening[0], s.dusk];
      seq.reduce((a, b) => { ok(a < b, 'Reihenfolge stimmt nicht'); return b; });
    });
    await test('Position: Mittags im Süden, Höhe plausibel', () => {
      const s = sunTimes(new Date(Date.UTC(2026, 5, 21, 11)), ...BONN);
      const p = sunPosition(s.solarNoon, ...BONN);
      near(p.azimuth, 180, 1, 'Azimut');
      near(p.altitude, 90 - 50.7374 + 23.44, 0.5, 'Höhe');
      eq(compass(p.azimuth), 'S');
    });

    section('Speicherrechner');
    await test('GB-Formel: 100 Mbit/s × 60 min = 45 GB', () => eq(videoGB(100, 60), 45));
    await test('180 GB → 1× 128 + 1× 64', () => {
      const p = planCards(180, [{ id: 'a', capacityGB: 128, quantity: 4 }, { id: 'b', capacityGB: 64, quantity: 2 }]);
      eq(p.picks.map((x) => [x.card.capacityGB, x.count]), [[128, 1], [64, 1]]);
      ok(p.enough, 'sollte reichen');
    });
    await test('60 GB → 1× 64 (kleinste passende Karte)', () => {
      const p = planCards(60, [{ id: 'a', capacityGB: 128, quantity: 4 }, { id: 'b', capacityGB: 64, quantity: 2 }]);
      eq(p.picks.map((x) => [x.card.capacityGB, x.count]), [[64, 1]]);
    });
    await test('Inventar reicht nicht → Warnung', () => {
      const p = planCards(900, [{ id: 'a', capacityGB: 128, quantity: 4 }, { id: 'b', capacityGB: 64, quantity: 2 }]);
      ok(!p.enough, 'enough müsste false sein'); eq(p.totalInventoryGB, 640);
    });
    await test('Hochzeit Video 10 h, 40 %, 2 Bodies (200+150) → 819 GB inkl. 30 %', () => {
      const r = calcStorage({ durationMin: 600, share: 0.4, mode: 'video', cameras: [{ bitrateMbps: 200 }, { bitrateMbps: 150 }], photoGBPerHour: 20, cards: [] });
      eq(r.minutes, 240); eq(Math.round(r.rawGB), 630); eq(r.needGB, 819);
    });
    await test('Foto-Modus nutzt GB/h statt Bitrate', () => {
      const r = calcStorage({ durationMin: 600, share: 0.3, mode: 'photo', cameras: [{ bitrateMbps: 200 }], photoGBPerHour: 20, cards: [] });
      eq(r.needGB, Math.ceil(60 * 1.3));
    });

    section('Akkurechner');
    await test('240 min / 70 min → 4 + 1 Reserve = 5', () => eq(calcBatteries({ durationMin: 600, share: 0.4, bodies: 1, runtimeMin: 70, cold: false, available: 6 }).need, 5));
    await test('Kälte → +1', () => eq(calcBatteries({ durationMin: 600, share: 0.4, bodies: 1, runtimeMin: 70, cold: true, available: 6 }).need, 6));
    await test('Exakte Teilung rundet nicht auf', () => eq(calcBatteries({ durationMin: 140, share: 1, bodies: 1, runtimeMin: 70, cold: false }).need, 3));
    await test('2 Bodies, zu wenig Akkus → Warnung', () => {
      const b = calcBatteries({ durationMin: 600, share: 0.4, bodies: 2, runtimeMin: 70, cold: false, available: 6 });
      eq(b.need, 9); ok(!b.enough, 'enough müsste false sein');
    });

    section('Regel-Engine & Packliste');
    const gear = DEFAULT_GEAR.map((g) => ({ ...g }));
    const tpl = (id) => DEFAULT_TEMPLATES.find((t) => t.id === id);
    const baseCtx = (over = {}) => ({
      shoot: { mode: 'hybrid', indoorOutdoor: 'outdoor' }, template: tpl('wedding'), gear,
      weather: null, sun: null, wrapAt: new Date(2026, 6, 4, 18), durationMin: 480, ...over,
    });
    const ids = (r) => r.items.map((i) => i.itemId);
    await test('Regen 50 % outdoor → Regencover mit Grund', () => {
      const r = autoItems(baseCtx({ weather: { rainProb: 50, windMax: 10, tempMin: 15, sunny: false } }));
      const cover = r.items.find((i) => i.itemId === 'rain-cover');
      ok(cover, 'Regencover fehlt'); eq(cover.reasons, ['Regen 50 %']);
    });
    await test('Regen 50 % indoor → kein Regencover', () => {
      const r = autoItems(baseCtx({ shoot: { mode: 'hybrid', indoorOutdoor: 'indoor' }, weather: { rainProb: 50, windMax: 10, tempMin: 15 } }));
      ok(!ids(r).includes('rain-cover'), 'Regencover drin');
    });
    await test('Wrap nach Sonnenuntergang → Licht-Kit + Stirnlampe', () => {
      const r = autoItems(baseCtx({ sun: { sunset: new Date(2026, 10, 21, 16, 35) }, wrapAt: new Date(2026, 10, 21, 22) }));
      ['led-panel', 'light-battery', 'headlamp'].forEach((id) => ok(ids(r).includes(id), `${id} fehlt`));
    });
    await test('Wrap vor Sonnenuntergang → kein Licht-Kit', () => {
      const r = autoItems(baseCtx({ sun: { sunset: new Date(2026, 5, 21, 21, 51) }, wrapAt: new Date(2026, 5, 21, 18) }));
      ok(!ids(r).includes('headlamp'), 'Stirnlampe drin');
    });
    await test('Wind > 30, Kälte, langer Tag', () => {
      const r = autoItems(baseCtx({ weather: { rainProb: 0, windMax: 42, tempMin: 2 }, durationMin: 600 }));
      ['deadcat', 'sandbags', 'hand-warmers', 'powerbank'].forEach((id) => ok(ids(r).includes(id), `${id} fehlt`));
      ok(r.hints.length === 1, 'Kälte-Hinweis fehlt');
    });
    await test('Foto-Modus entfernt Audio', () => {
      const r = autoItems(baseCtx({ shoot: { mode: 'photo', indoorOutdoor: 'outdoor' } }));
      ok(!ids(r).includes('lav-kit'), 'Lavalier drin');
    });
    await test('Gelöschtes Gear wird übersprungen', () => {
      const r = autoItems(baseCtx({ gear: gear.filter((g) => g.id !== 'gimbal') }));
      ok(!ids(r).includes('gimbal'), 'Gimbal drin');
    });

    await test('Manuelle Items + Häkchen bleiben bei Neuberechnung erhalten', () => {
      const auto = autoItems(baseCtx()).items;
      const prev = [
        { itemId: 'cam-a', label: 'x', category: 'camera', checked: true, auto: true },
        { itemId: null, label: 'Drohne', category: 'misc', checked: true, auto: false },
      ];
      const merged = mergeChecklist(auto, prev, ['gimbal']);
      ok(merged.find((i) => i.label === 'Drohne')?.checked, 'manuelles Item fehlt');
      ok(merged.find((i) => i.itemId === 'cam-a').checked, 'Häkchen verloren');
      ok(!merged.some((i) => i.itemId === 'gimbal'), 'entferntes Auto-Item wieder da');
      const again = mergeChecklist(auto, merged, ['gimbal']);
      eq(again.map(keyOf), merged.map(keyOf), 'zweite Berechnung stabil');
    });

    section('Abfahrtszeit');
    const S = { bufferPct: 20, bufferMinMin: 15, setupMin: 30 };
    await test('Puffer: max(15 min, 20 %)', () => { eq(bufferMinutes(40, S), 15); eq(bufferMinutes(120, S), 24); });
    await test('Call 08:30, 60 min Fahrt → 06:45', () => {
      const d = departure({ date: '2026-07-04', callTime: '08:30' }, 60, S);
      eq([d.at.getHours(), d.at.getMinutes()], [6, 45]);
    });
    await test('Über Mitternacht: Call 00:30, 40 min → 23:05 am Vortag', () => {
      const d = departure({ date: '2026-07-04', callTime: '00:30' }, 40, S);
      eq([d.at.getDate(), d.at.getHours(), d.at.getMinutes()], [3, 23, 5]);
    });
    await test('Zeitumstellung 29.03.: Call 04:00 MESZ, 60 min → 01:15 MEZ', () => {
      if (!isBerlin) return 'skip';
      const d = departure({ date: '2026-03-29', callTime: '04:00' }, 60, S);
      eq([d.at.getHours(), d.at.getMinutes()], [1, 15]);
    });
    await test('Zeitumstellung 25.10.: Drehdauer 01:00→04:00 ist real 4 h', () => {
      if (!isBerlin) return 'skip';
      const a = parseDateTime('2026-10-25', '01:00'), b = parseDateTime('2026-10-25', '04:00');
      eq((b - a) / 3600000, 4);
    });
    await test('Ohne Fahrzeit → keine Abfahrt', () => eq(departure({ date: '2026-07-04', callTime: '08:30' }, null, S), null));

    section('Wetter & Geocoding');
    const mockJson = {
      hourly: {
        time: ['2026-11-21T09:00', '2026-11-21T10:00', '2026-11-21T11:00', '2026-11-21T22:00'],
        temperature_2m: [3.2, 4.1, 6.0, 1.0], precipitation_probability: [10, 55, 30, 90],
        wind_speed_10m: [12, 34.6, 20, 5], cloud_cover: [90, 80, 70, 100], weather_code: [3, 61, 3, 63],
      },
    };
    await test('Parse + Drehzeit-Filter + Zusammenfassung', () => {
      const hours = hoursForShoot(parseHourly(mockJson), { date: '2026-11-21', callTime: '10:00', wrapTime: '12:00' });
      eq(hours.map((h) => h.time.slice(11)), ['10:00', '11:00']);
      const s = summarize(hours);
      eq([s.rainProb, s.windMax, s.tempMin, s.sunny], [55, 35, 4, false]);
    });
    await test('Stadt aus Adresse', () => eq(cityFromAddress('Drachenfelsstraße 118, 53639 Königswinter'), 'Königswinter'));

    db.useDatabase('shootday-test-' + Date.now());
    await test('Wetter: Netz → Cache → offline zeigt letzten Stand', async () => {
      const date = addDaysISO(new Date().toISOString().slice(0, 10), 2);
      const shoot = { date, callTime: '10:00', wrapTime: '12:00', location: { lat: 50.73, lon: 7.09 } };
      setFetch(async () => ({ ok: true, json: async () => ({ hourly: { ...mockJson.hourly, time: mockJson.hourly.time.map((t) => date + t.slice(10)) } }) }));
      const live = await loadWeather(shoot);
      eq(live.status, 'ok'); eq(live.hours.length, 4);
      setFetch(async () => { throw new Error('offline'); });
      const stale = await loadWeather(shoot);
      eq(stale.status, 'stale'); eq(stale.hours.length, 4); ok(stale.fetchedAt, 'Stand fehlt');
    });
    await test('Wetter > 16 Tage → noch keine Prognose', async () => {
      const r = await loadWeather({ date: addDaysISO(new Date().toISOString().slice(0, 10), 30), location: { lat: 1, lon: 1 } });
      eq(r.status, 'too-far');
    });

    section('Abnahme: Hochzeit Bonn, Samstag 10–22 Uhr, outdoor');
    await test('Liste inkl. Licht, Akkus/Karten mit Mengen, Sonnenzeiten korrekt', () => {
      const shoot = {
        id: 't', type: 'wedding', mode: 'hybrid', indoorOutdoor: 'outdoor', date: '2026-11-21', callTime: '10:00', wrapTime: '22:00',
        location: { label: 'Bonn', lat: BONN[0], lon: BONN[1] }, checklist: [], excluded: [], travel: { driveMin: 30 },
      };
      const ap = computeAutopilot({ shoot, gear, template: tpl('wedding'), settings: { ...db.DEFAULT_SETTINGS }, weatherHours: [] });
      const light = ap.checklist.find((i) => i.itemId === 'led-panel');
      ok(light && light.reasons[0].startsWith('Wrap nach Sonnenuntergang'), 'Licht fehlt');
      ok(ap.checklist.find((i) => i.itemId === 'headlamp'), 'Stirnlampe fehlt');
      const bat = ap.checklist.find((i) => i.itemId === 'cam-battery');
      ok(bat?.qty >= 2, 'Akku-Menge fehlt');
      ok(ap.checklist.some((i) => i.category === 'storage' && i.qty), 'Karten-Menge fehlt');
      ok(ap.checklist.some((i) => i.category === 'personal'), 'persönliche Items fehlen');
      const ref = noaaSun(2026, 11, 21, ...BONN);
      near(utcMin(ap.sun.sunset), ref.sunset, 2, 'Sonnenuntergang');
      ok(ap.departure, 'Abfahrt fehlt');
    });

    section('Basis');
    await test('Drehdauer über Mitternacht', () => eq(durationMin('20:00', '02:30'), 390));
    await test('Tage über Zeitumstellung', () => eq(daysUntil('2026-03-30', new Date(2026, 2, 28)), 2));
    await test('HTML-Escape', () => eq(esc('<b>"&\''), '&lt;b&gt;&quot;&amp;&#39;'));
    await test('Übersicht-Buckets', () => {
      const s = (id, date, extra = {}) => ({ id, date, callTime: '09:00', phase: 'planned', backup: { done: false }, ...extra });
      const b = bucketShoots([s('f2', '2026-12-05'), s('f1', '2026-11-20'), s('po', '2026-11-01'), s('pd', '2026-10-01', { backup: { done: true } })], '2026-11-19');
      eq(b.upcoming.map((x) => x.id), ['f1', 'f2']); eq(b.backupOpen.map((x) => x.id), ['po']); eq(b.archive.map((x) => x.id), ['pd']);
    });
    await test('IndexedDB: Seed, speichern, lesen, löschen', async () => {
      await db.seedIfNeeded();
      ok((await db.all('gear')).length > 10, 'Start-Inventar fehlt');
      const shoot = db.createShoot({ title: 'Test', date: '2026-12-01' });
      await db.saveShoot(shoot);
      eq((await db.get('shoots', shoot.id)).title, 'Test');
      await db.del('shoots', shoot.id);
      eq(await db.get('shoots', shoot.id), undefined);
    });

    // ---------- Report ----------
    const groups = [...new Set(results.map((r) => r.group))];
    document.getElementById('out').innerHTML = groups.map((g) => `<h2>${g}</h2><ul>${results.filter((r) => r.group === g)
      .map((r) => `<li class="${r.status}">${r.name}${r.msg ? ' – ' + r.msg : ''}${r.status === 'skip' ? ' (übersprungen: Gerätezeitzone ist nicht Europe/Berlin)' : ''}</li>`).join('')}</ul>`).join('');
    const failed = results.filter((r) => r.status === 'fail').length;
    const skipped = results.filter((r) => r.status === 'skip').length;
    document.getElementById('summary').textContent = failed
      ? `${failed} von ${results.length} fehlgeschlagen`
      : `Alle ${results.length - skipped} Tests grün${skipped ? ` (${skipped} übersprungen)` : ''}`;
    window.__testResults = results;
  </script>
</body>
</html>
